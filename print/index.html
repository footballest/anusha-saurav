<!doctype html>
<!--
  PRINT LAYOUT — one A5 portrait page, used only to make the PDFs (scripts/make-pdf.mjs).

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <title>Anusha &amp; Saurav · Invitation (print)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="../assets/css/site.css">
  <link rel="stylesheet" href="../assets/css/print.css">
  <script>
    document.documentElement.setAttribute("data-theme", "green");
    window.VARIANT = new URLSearchParams(location.search).get("v") === "reception" ? "reception" : "full";

  <script src="../assets/js/print.js" defer></script>
