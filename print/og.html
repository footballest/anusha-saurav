<!doctype html>
<!--
  PREVIEW IMAGE TEMPLATE — 1200×630, used only by scripts/make-og.mjs to make
  assets/img/og-full.jpg (?v=full) and assets/img/og-reception.jpg (?v=reception),
  the pictures WhatsApp shows for each link. Everything important sits in the centre
  630 px, because WhatsApp sometimes crops the preview to a square. Not linked anywhere.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Preview image</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=EB+Garamond:ital,wght@0,400;1,400&family=Great+Vibes&family=Manjari:wght@400&display=swap">
  <link rel="stylesheet" href="../assets/css/site.css">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--page); }
    body { position: relative; font-family: var(--font-body); }
    body::before { position: absolute; -webkit-mask-size: 64px 64px; mask-size: 64px 64px; opacity: .2; }
    .panel {
      position: absolute; left: 285px; top: 0; width: 630px; height: 630px;
      background: var(--paper); text-align: center;
      clip-path: polygon(50% 0, 100% 46px, 100% 100%, 0 100%, 0 46px);
    }
    .frame { position: absolute; inset: 10px 10px 0; }
    .frame svg { position: absolute; top: 0; left: 0; width: 100%; height: 46px; overflow: visible; }
    .frame svg path { fill: none; stroke: var(--line); stroke-width: 1.4; vector-effect: non-scaling-stroke; }
    .frame .sides { position: absolute; top: 36px; left: 0; right: 0; bottom: 30px; border: 1.4px solid var(--line); border-top: 0; border-bottom: 0; }
    .band { position: absolute; left: 0; right: 0; bottom: 0; height: 26px; background: url("../assets/img/kasavu-border.svg") repeat-x center / 52px 26px; }
    .content { position: relative; padding-top: 50px; }
    .ganapathi { width: 34px; display: block; margin: 0 auto 2px; }
    .invocation { font-family: var(--font-ml); color: var(--title); font-size: 15px; margin: 0; }
    .couple { display: block; height: 300px; width: auto; margin: 4px auto 0; mix-blend-mode: multiply; }
    .names { font-family: var(--font-script); color: var(--title); font-size: 74px; line-height: 1; margin: 2px 0 0; font-weight: 400; }
    .names span { color: var(--accent); font-size: .72em; }
    .line1 { font-family: var(--font-caps); font-size: 21px; letter-spacing: .08em; color: var(--ink); margin: 8px 0 0; }
    .line2 { font-family: var(--font-caps); font-size: 14px; letter-spacing: .28em; text-transform: uppercase; color: var(--label); margin: 6px 0 0; }
    .lamp { position: absolute; bottom: 40px; width: 150px; }
    .lamp.l { left: 70px; } .lamp.r { right: 70px; }
    .glow { position: absolute; bottom: 210px; width: 260px; height: 260px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 214, 120, .38), rgba(255, 214, 120, 0) 65%); }
    .glow.l { left: 15px; } .glow.r { right: 15px; }
    .jasmine { position: absolute; top: -4px; height: 150px; }
    .jasmine.a { left: 20px; } .jasmine.b { left: 170px; height: 110px; transform: scaleX(-1); }
    .jasmine.c { right: 170px; height: 110px; } .jasmine.d { right: 20px; transform: scaleX(-1); }
    .invited { position: absolute; top: 236px; width: 285px; text-align: center; font-family: var(--font-script); font-size: 46px; color: var(--on-page); margin: 0; }
  </style>
  <script>
    window.VARIANT = new URLSearchParams(location.search).get("v") === "reception" ? "reception" : "full";
    window.ROOT = "../";
    window.API_URL = "";   // the template uses the committed data only
  </script>
  <script src="../assets/js/data.js" defer></script>
</head>
<body>
  <div class="glow l"></div><div class="glow r"></div>
  <img class="lamp l" src="../assets/img/nilavilakku.svg" alt="">
  <img class="lamp r" src="../assets/img/nilavilakku.svg" alt="">
  <img class="jasmine a" src="../assets/img/jasmine.svg" alt=""><img class="jasmine b" src="../assets/img/jasmine.svg" alt="">
  <img class="jasmine c" src="../assets/img/jasmine.svg" alt=""><img class="jasmine d" src="../assets/img/jasmine.svg" alt="">
  <div class="panel">
    <div class="frame">
      <svg viewBox="0 0 100 46" preserveAspectRatio="none"><path d="M0 46 L0 36 L50 0 L100 36 L100 46"/><path d="M3 46 L3 38 L50 5 L97 38 L97 46" opacity=".55"/></svg>
      <div class="sides"></div>
    </div>
    <div class="band"></div>
    <div class="content" id="content"></div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      window.loadSiteData(function (d) {
        var full = window.VARIANT === "full";
        var lines = full
          ? ["Wedding 16 Dec · Reception 19 Dec 2026", "Kozhikode"]
          : ["Reception · Saturday, 19 December 2026", "K-Hills Resorts & Spa · Ramanattukara"];
        document.getElementById("content").innerHTML =
          '<img class="ganapathi" src="../assets/img/ganapathi.svg" alt="">' +
          '<p class="invocation" lang="ml">' + d.settings.invocation + "</p>" +
          '<img class="couple" src="../' + d.images.hero + '" alt="">' +
          '<h1 class="names">Anusha <span>&amp;</span> Saurav</h1>' +
          '<p class="line1">' + lines[0].replace(/&/g, "&amp;") + "</p>" +
          '<p class="line2">' + lines[1].replace(/&/g, "&amp;") + "</p>";
        document.documentElement.setAttribute("data-ready", "1");
      });
    });
  </script>
</body>
</html>
